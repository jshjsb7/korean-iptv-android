<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>한국 IPTV 모바일</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#182235;--line:#2a3951;--accent:#4ea1ff;--muted:#a8b5c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f6fb;font:15px system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:#101827ee;backdrop-filter:blur(8px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px}#status{font-size:12px;color:var(--muted);margin-top:7px}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);color:#fff}
.controls{display:flex;gap:8px}#search{flex:1;min-width:0}button{background:#244d7c;border-color:#37689e}
main{padding:12px;max-width:900px;margin:auto}
#playerWrap{background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
video{width:100%;max-height:42vh;aspect-ratio:16/9;display:block;background:#000}
#now{padding:10px 12px;background:#141e2f;font-size:13px;min-height:38px}
#channelTitle{font-weight:700;font-size:17px;margin-bottom:4px}
#category{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}
.chip{white-space:nowrap;padding:8px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chip.active{background:#244d7c;border-color:var(--accent)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.channel{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);padding:10px;min-height:74px}
.channel.selected{border-color:var(--accent);background:#20344e}
.channel img{width:36px;height:36px;object-fit:contain;border-radius:6px;background:#fff}
.chtext{min-width:0}.name{font-weight:650;overflow-wrap:anywhere}.group{font-size:11px;color:var(--muted);margin-top:4px}.program{font-size:12px;color:#8ec4ff;margin-top:5px;line-height:1.35}
small,.muted{color:var(--muted)}.foot{font-size:12px;color:var(--muted);padding:18px 2px;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>🇰🇷 한국 IPTV</h1>
  <div class="controls">
    <input id="search" placeholder="채널 검색" aria-label="채널 검색">
    <button id="refresh">새로고침</button>
  </div>
  <div id="status">채널 및 편성표를 불러오는 중…</div>
</header>
<main>
  <div id="playerWrap">
    <video id="video" controls playsinline webkit-playsinline></video>
    <div style="padding:8px 12px;background:#141e2f;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button id="audioOnly">오디오만 재생</button><button id="screenMode">영상 화면 켜기</button><span id="audioStatus" class="muted" style="font-size:12px">오디오 모드에서는 화면을 꺼도 재생될 수 있지만 브라우저/시스템 정책에 따라 중단될 수 있습니다.</span></div>
    <div id="now"><div id="channelTitle">채널을 선택하세요</div><div id="programNow" class="muted">재생할 채널을 아래에서 누르세요.</div></div>
  </div>
  <div id="category"></div>
  <div id="list"></div>
  <div class="foot">재생은 제공 서버와 채널의 상태에 따라 달라질 수 있습니다. 일부 방송은 지역·시간·접속 권한 또는 요청 헤더 제한으로 재생되지 않을 수 있습니다. 제공 권한이 있는 스트림만 이용하세요.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const CHANNEL_URL='https://backup.760515.xyz/koreatv.json';
const EPG_URL='https://backup.760515.xyz/koreatvEPG.xml';
const $=id=>document.getElementById(id);
let channels=[], programs=[], activeGroup='전체', selected=null, hls=null, audioOnly=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){$('status').textContent=s}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'')}
function parseXmltvTime(s){
 const m=String(s||'').match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
 if(!m)return null;
 // XMLTV timestamps often include +0900; convert local wall time to UTC via offset
 const tail=String(s).slice(14).trim(), off=tail.match(/^([+-])(\d{2})(\d{2})/);
 let ms=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
 if(off){const mins=(+off[2]*60 + +off[3])*(off[1]==='+'?1:-1);ms-=mins*60000}
 return new Date(ms);
}
function parseEpg(xml){
 const doc=new DOMParser().parseFromString(xml,'text/xml');
 if(doc.querySelector('parsererror'))throw Error('EPG XML 형식을 읽을 수 없습니다');
 const out=[];
 doc.querySelectorAll('programme').forEach(p=>{
   const start=parseXmltvTime(p.getAttribute('start')), stop=parseXmltvTime(p.getAttribute('stop'));
   const title=p.querySelector('title')?.textContent?.trim();
   if(start&&stop&&title)out.push({id:p.getAttribute('channel')||'',start,stop,title});
 });
 return out;
}
function programFor(ch){
 const now=new Date(), id=String(ch.epgId||ch['tvg-id']||ch.id||ch.name||ch.title||'');
 const aliases=[id,ch.name,ch.title].map(norm).filter(Boolean);
 let p=programs.find(x=>aliases.includes(norm(x.id))&&x.start<=now&&x.stop>now);
 if(!p){const names=aliases.filter(x=>x.length>1);p=programs.find(x=>names.some(n=>norm(x.id).includes(n)||n.includes(norm(x.id)))&&x.start<=now&&x.stop>now)}
 return p?.title||'편성 정보 없음';
}
function groups(){return ['전체',...new Set(channels.map(c=>c.group||'기타'))]}
function renderGroups(){
 $('category').innerHTML=groups().map(g=>`<button class="chip ${g===activeGroup?'active':''}" data-group="${esc(g)}">${esc(g)}</button>`).join('');
 $('category').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeGroup=b.dataset.group;renderGroups();renderList()});
}
function renderList(){
 const q=norm($('search').value);
 const visible=channels.filter(c=>(activeGroup==='전체'||(c.group||'기타')===activeGroup)&&(!q||norm(c.name||c.title).includes(q)));
 $('list').innerHTML=visible.map((c)=>{
   const idx=channels.indexOf(c), nm=c.name||c.title||'이름 없는 채널';
   return `<button class="channel ${selected===idx?'selected':''}" data-idx="${idx}">
    <img loading="lazy" src="${esc(c.logo||'')}" onerror="this.style.display='none'">
    <span class="chtext"><span class="name">${esc(nm)}</span><div class="group">${esc(c.group||'기타')}</div><div class="program">${esc(programFor(c))}</div></span>
   </button>`;
 }).join('');
 $('list').querySelectorAll('button').forEach(b=>b.onclick=()=>playChannel(+b.dataset.idx));
}
function playChannel(i){
 const c=channels[i];if(!c)return;
 const url=Array.isArray(c.uris)?c.uris[0]:c.url||c.uri;
 if(!url){status('이 채널에는 재생 URL이 없습니다.');return}
 selected=i;
 $('channelTitle').textContent=c.name||c.title||'채널';
 $('programNow').textContent=programFor(c);
 renderList();
 const video=$('video');
 if(hls){hls.destroy();hls=null}
 video.pause();video.removeAttribute('src');video.load();
 if(window.Hls&&Hls.isSupported()){
   hls=new Hls({enableWorker:true});
   hls.loadSource(url);hls.attachMedia(video);
   hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)status('재생 오류: 해당 스트림 형식, 서버 권한 또는 접속 제한을 확인하세요.')});
   hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>status('재생 준비 완료. 화면의 재생 버튼을 누르세요.')));
 }else if(video.canPlayType('application/vnd.apple.mpegurl')){
   video.src=url;video.play().catch(()=>status('재생 준비 완료. 화면의 재생 버튼을 누르세요.'));
 }else{
   status('이 휴대폰 WebView에서 HLS 재생을 지원하지 않습니다.');
 }
 status('선택: '+(c.name||c.title||'채널'));
}

function setAudioOnly(on){
 audioOnly=on;
 const video=$('video');
 // Keep the same media element so audio continues from the selected stream.
 video.style.height=on?'1px':'auto';
 video.style.maxHeight=on?'1px':'42vh';
 video.style.opacity=on?'0.01':'1';
 video.style.position=on?'absolute':'static';
 video.style.left=on?'-9999px':'auto';
 $('audioOnly').textContent=on?'오디오 전용 모드 켜짐':'오디오만 재생';
 $('screenMode').style.display=on?'inline-block':'none';
 $('audioStatus').textContent=on
   ?'오디오 전용 모드입니다. 화면이 꺼진 상태의 재생은 브라우저/기기 정책에 따라 중단될 수 있습니다.'
   :'백그라운드 재생은 Android 앱과 WebView의 지원 여부에 따라 달라집니다.';
}
$('audioOnly').onclick=()=>{
 const video=$('video');
 if(!video.src && !hls){status('먼저 재생할 채널을 선택하세요.');return}
 setAudioOnly(!audioOnly);
 if(video.paused)video.play().catch(()=>status('재생 버튼을 눌러 오디오를 시작하세요.'));
};
$('screenMode').onclick=()=>setAudioOnly(false);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden && audioOnly && !$('video').paused){
   // Do not force playback; browsers may suspend background WebViews.
   $('audioStatus').textContent='앱이 백그라운드에 있습니다. 기기 정책에 따라 오디오가 계속되거나 일시 중지될 수 있습니다.';
 }
});

async function loadAll(){
 $('refresh').disabled=true;status('채널 및 편성표 업데이트 중…');
 try{
   const cr=await fetch(CHANNEL_URL,{cache:'no-store'});
   if(!cr.ok)throw Error('채널 목록 HTTP '+cr.status);
   const raw=await cr.json();
   channels=Array.isArray(raw)?raw:raw.channels||[];
   if(!channels.length)throw Error('채널 목록이 비어 있습니다');
 }catch(e){status('채널 불러오기 실패: '+e.message+' (서버 CORS 설정 또는 인터넷 연결 확인)');$('refresh').disabled=false;return}
 try{
   const er=await fetch(EPG_URL,{cache:'no-store'});
   if(!er.ok)throw Error('EPG HTTP '+er.status);
   programs=parseEpg(await er.text());
 }catch(e){programs=[];status('채널은 불러왔지만 EPG를 읽지 못했습니다: '+e.message+' (CORS 제한일 수 있음)')}
 activeGroup='전체';renderGroups();renderList();
 if(!selected&&channels.length)status(`채널 ${channels.length}개 불러옴 · 채널을 선택하세요`);
 else status(`채널 ${channels.length}개 · EPG 프로그램 ${programs.length}개`);
 $('refresh').disabled=false;
}
$('search').addEventListener('input',renderList);
$('refresh').onclick=loadAll;
loadAll();
</script>
</body>
</html>
